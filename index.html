<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>פודקאסט תנ"ך</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f7f6;
            font-family: 'Segoe UI', sans-serif;
        }

        .card {
            border-radius: 15px;
            border: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            transition: 0.3s;
            position: relative;
        }

            .card:hover {
                transform: translateY(-5px);
            }

        .menu-dots {
            position: absolute;
            top: 15px;
            left: 15px;
            cursor: pointer;
            font-size: 24px;
            font-weight: bold;
            color: #6c757d;
        }

        .upload-section {
            background: white;
            border-top: 5px solid #0d6efd;
        }

        .filter-section {
            background: #e9ecef;
            border-radius: 10px;
            padding: 20px;
        }

        #qrModal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 3000;
            justify-content: center;
            align-items: center;
        }

        .qr-content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div id="qrModal" onclick="this.style.display='none'">
        <div class="qr-content" onclick="event.stopPropagation()">
            <h5>סרוק להאזנה ישירה</h5>
            <div id="qrcode" class="d-flex justify-content-center my-3"></div>
            <button class="btn btn-secondary" onclick="document.getElementById('qrModal').style.display='none'">סגור</button>
        </div>
    </div>

    <div class="container py-5">
        <h1 class="text-center mb-5">ספריית הפודקאסטים</h1>

        <div class="card p-4 mb-5 upload-section">
            <h4 class="mb-4">העלאת פודקאסט חדש</h4>
            <div class="row g-3">
                <div class="col-md-6"><input type="text" id="title" class="form-control" placeholder="שם הפודקאסט - שמות המשתתפים"></div>
                <div class="col-md-3">
                    <select id="grade" class="form-select">
                        <option value="" disabled selected>בחר כיתה</option>
                        <option value="י&quot;א-1">י"א-1</option>
                        <option value="י&quot;א-2">י"א-2</option>
                        <option value="י&quot;א-3">י"א-3</option>
                        <option value="י&quot;א-4">י"א-4</option>
                        <option value="י&quot;א-5">י"א-5</option>
                        <option value="י&quot;א-6">י"א-6</option>
                        <option value="י&quot;א-7">י"א-7</option>
                        <option value="י&quot;א-8">י"א-8</option>
                        <option value="י&quot;א-9">י"א-9</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <select id="chapter" class="form-select">
                        <option value="" disabled selected>בחר פרק</option>
                        <option value="ויקרא י&quot;ט">ויקרא י"ט</option>
                        <option value="דברים ט&quot;ז">דברים ט"ז</option>
                        <option value="דברים י&quot;ז">דברים י"ז</option>
                        <option value="דברים כ'">דברים כ'</option>
                    </select>
                </div>
                <div class="col-md-6">
                    <select id="theme" class="form-select" onchange="updateLawOptions('theme', 'law')">
                        <option value="" disabled selected>בחר נושא על</option>
                        <option value="חוקים סוציאליים">חוקים סוציאליים</option>
                        <option value="חוקי מוסר וערכים">חוקי מוסר וערכים</option>
                        <option value="חוקי חגים ומועדים">חוקי חגים ומועדים</option>
                        <option value="חוקי שלטון ומשפט">חוקי שלטון ומשפט</option>
                        <option value="חוקי מלחמה">חוקי מלחמה</option>
                    </select>
                </div>
                <div class="col-md-6"><select id="law" class="form-select" disabled><option value="">בחר קודם נושא...</option></select></div>
                <div class="col-md-6"><input type="file" id="audioFile" class="form-control" accept="audio/*"></div>
                <div class="col-md-6"><input type="password" id="secretPass" class="form-control" placeholder="סיסמה להעלאה"></div>
                <div class="col-12"><button onclick="uploadPodcast()" id="uploadBtn" class="btn btn-primary w-100 py-2">העלה פודקאסט</button></div>
            </div>
        </div>

        <div class="filter-section mb-4">
            <div class="row g-2">
                <div class="col-md-3">
                    <select id="filterGrade" class="form-select" onchange="loadPodcasts()">
                        <option value="">כל הכיתות</option>
                        <option value="י&quot;א-1">י"א-1</option>
                        <option value="י&quot;א-2">י"א-2</option>
                        <option value="י&quot;א-3">י"א-3</option>
                        <option value="י&quot;א-4">י"א-4</option>
                        <option value="י&quot;א-5">י"א-5</option>
                        <option value="י&quot;א-6">י"א-6</option>
                        <option value="י&quot;א-7">י"א-7</option>
                        <option value="י&quot;א-8">י"א-8</option>
                        <option value="י&quot;א-9">י"א-9</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <select id="filterTheme" class="form-select" onchange="updateLawOptions('filterTheme', 'filterLaw'); loadPodcasts();">
                        <option value="">כל הנושאים</option>
                        <option value="חוקים סוציאליים">חוקים סוציאליים</option>
                        <option value="חוקי מוסר וערכים">חוקי מוסר וערכים</option>
                        <option value="חוקי חגים ומועדים">חוקי חגים ומועדים</option>
                        <option value="חוקי שלטון ומשפט">חוקי שלטון ומשפט</option>
                        <option value="חוקי מלחמה">חוקי מלחמה</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <select id="filterLaw" class="form-select" onchange="loadPodcasts()">
                        <option value="">כל החוקים</option>
                    </select>
                </div>
            </div>
        </div>

        <div id="podcastsList" class="row"></div>
    </div>

    <script>
        var mySupabase = supabase.createClient('https://cnohqzusmjjbvdsgcwty.supabase.co', 'sb_publishable_8NCtHzt5sebVtCmPkHbWKQ_Omjx6b69');
        var lawsData = {
            "חוקים סוציאליים": ["פאה", "לקט", "שכחה", "עוללות", "פרט", "חוק העבוט", "השבת משכון", "איסור הלנת שכר"],
            "חוקי מוסר וערכים":["לא תגנוב","איסור רכילות", "לא תעמוד על דם רעך", "איסור קללת חירש", "לפני עיוור לא תיתן מכשול", "איסור עוול במשפט", "איסור שנאה בלב", "מצוות תוכחה", "איסור נקמה ונטירה", "ואהבת לרעך כמוך","לא תגנוב"],
            "חוקי חגים ומועדים": ["חוקי המועדים (פסח, שבועות וסוכות)"],
            "חוקי שלטון ומשפט": ["הקמת מערכת משפט", "חוק המלך", "כתיבת ספר תורה על ידי המלך"],
            "חוקי מלחמה": ["קריאה לשלום לפני מצור", "איסור כריתת עצי פרי במלחמה", "שחרור מהצבא"]
        };

        function showQR(url) {
            document.getElementById('qrcode').innerHTML = "";
            new QRCode(document.getElementById("qrcode"), { text: url, width: 200, height: 200 });
            document.getElementById('qrModal').style.display = 'flex';
        }

        function updateLawOptions(themeId, lawId) {
            var theme = document.getElementById(themeId).value;
            var lawSelect = document.getElementById(lawId);
            lawSelect.innerHTML = '<option value="">כל החוקים</option>';
            if (theme && lawsData[theme]) {
                lawSelect.disabled = false;
                lawsData[theme].forEach(law => {
                    var opt = document.createElement('option');
                    opt.value = law; opt.innerText = law;
                    lawSelect.appendChild(opt);
                });
            } else {
                lawSelect.disabled = (themeId === 'filterTheme' ? false : true);
            }
        }

        async function loadPodcasts() {
            var grade = document.getElementById('filterGrade').value;
            var theme = document.getElementById('filterTheme').value;
            var law = document.getElementById('filterLaw').value;

            var query = mySupabase.from('podcast').select('*').order('created_at', { ascending: false });
            if (grade) query = query.eq('grade', grade);
            if (theme) query = query.eq('theme', theme);
            if (law) query = query.eq('law', law);

            var { data } = await query;
            var listDiv = document.getElementById('podcastsList');
            listDiv.innerHTML = (!data || data.length === 0) ? '<p class="text-center w-100 mt-4">לא נמצאו פודקאסטים</p>' : '';

            data?.forEach(p => {
                listDiv.innerHTML += `
                    <div class="col-md-6 mb-4">
                        <div class="card p-3">
                            <div class="menu-dots" onclick="showQR('${p.url}')">⋮</div>
                            <div class="badge bg-primary mb-2" style="width: fit-content;">${p.theme}</div>
                            <h5 class="fw-bold">${p.title}</h5>
                            <p class="small text-muted mb-2"><b>כיתה:</b> ${p.grade} | <b>פרק:</b> ${p.chapter} <br><b>חוק:</b> ${p.law}</p>
                            
                            <!-- הוספנו preload="metadata" ו-type="audio/mpeg" מפורש -->
                            <audio controls preload="metadata" class="w-100 mt-2">
                                <source src="${p.url}" type="audio/mpeg">
                                הדפדפן שלך לא תומך בנגן.
                            </audio>
                        </div>
                    </div>`;
            });
        }

        function generateSafeFileName(originalName) {
            const ext = originalName.split('.').pop();
            return `podcast_${Date.now()}_${Math.floor(Math.random() * 1000)}.${ext}`;
        }

        async function uploadPodcast() {
            if (document.getElementById('secretPass').value !== "תנך123") return alert("סיסמה שגויה!");
            var file = document.getElementById('audioFile').files[0];
            if (!file) return alert("בחר קובץ!");

            var btn = document.getElementById('uploadBtn');
            btn.disabled = true; btn.innerText = "מעלה...";

            var safeName = generateSafeFileName(file.name);
            var { error: upErr } = await mySupabase.storage.from('files').upload(safeName, file);
            if (upErr) { alert("שגיאת העלאה: " + upErr.message); btn.disabled = false; return; }

            var { data: urlData } = mySupabase.storage.from('files').getPublicUrl(safeName);
            var { error: dbErr } = await mySupabase.from('podcast').insert([{
                title: document.getElementById('title').value,
                grade: document.getElementById('grade').value,
                chapter: document.getElementById('chapter').value,
                theme: document.getElementById('theme').value,
                law: document.getElementById('law').value,
                url: urlData.publicUrl
            }]);

            if (dbErr) alert(dbErr.message); else { alert("הפודקאסט עלה בהצלחה!"); location.reload(); }
        }

        loadPodcasts();
    </script>
</body>
</html>
